[package]
name = "atomusicator-infrastructure"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
atomusicator-domain = { path = "../domain" }
atomusicator-application = { path = "../application" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
lru.workspace = true
ort-sys.workspace = true
ndarray.workspace = true
realfft.workspace = true
apodize.workspace = true
rayon.workspace = true
symphonia.workspace = true
hound.workspace = true
directories.workspace = true
fs4.workspace = true
memmap2.workspace = true
thiserror.workspace = true
tokio.workspace = true
reqwest.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
ort = { workspace = true, features = ["directml", "cuda"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { workspace = true, features = ["coreml"] }

[target.'cfg(target_os = "ios")'.dependencies]
ort = { workspace = true, features = ["coreml"] }

[target.'cfg(target_os = "linux")'.dependencies]
ort = { workspace = true, features = ["cuda"] }
